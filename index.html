<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PLAYCO</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#c44dff">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@800&display=swap" rel="stylesheet">
<style>
/* ===== GLOBAL RESET ===== */
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Hiragino Maru Gothic Pro','BIZ UDPGothic',sans-serif;
  user-select:none; -webkit-user-select:none; overflow-x:hidden;
  min-height:100vh;
}

/* ===== HOME SCREEN ===== */
#screen-home {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  background:linear-gradient(135deg,#ffe0f0 0%,#fff0b0 40%,#b0f0ff 100%);
  padding:32px 16px;
}
.home-title {
  font-family:'Poppins',sans-serif;
  font-size:3.2rem;
  font-weight:800;
  letter-spacing:.12em;
  text-align:center;
  margin-bottom:6px;
  background:linear-gradient(135deg,#ff6b9d 0%,#c44dff 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  filter:drop-shadow(0 2px 8px rgba(196,77,255,.2));
}
.home-subtitle {
  font-size:.88rem;
  color:#bbb;
  text-align:center;
  letter-spacing:.1em;
  margin-bottom:32px;
}
.game-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  width:100%;
  max-width:380px;
  margin-bottom:16px;
}
.game-tile {
  border-radius:22px;
  padding:28px 12px 22px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  cursor:pointer;
  transition:transform .13s, box-shadow .13s;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  border:none;
}
.game-tile:active { transform:scale(.92); }
.game-tile.tile-dash { background:linear-gradient(140deg,#ff6b6b,#ff9f43); box-shadow:0 8px 24px rgba(255,107,107,.35); }
.game-tile.tile-iro  { background:linear-gradient(140deg,#ff8fab,#c44dff); box-shadow:0 8px 24px rgba(196,77,255,.3); }
.game-tile-icon { font-size:3rem; line-height:1; }
.game-tile-name { font-size:1.05rem; font-weight:bold; color:white; text-align:center; line-height:1.4; text-shadow:0 1px 6px rgba(0,0,0,.18); }
.game-tile.tile-dash .game-tile-name { color:white; }
.game-tile.tile-iro  .game-tile-name { color:white; }

/* ===== GAME WRAPPERS ===== */
#game-dashjump { display:none; width:100%; min-height:100vh; }
#game-iromaze  { display:none; width:100%; min-height:100vh; }

/* ===== HOME BUTTON (shared style) ===== */
.home-btn {
  position:absolute;
  top:10px;
  left:10px;
  z-index:200;
  background:rgba(255,255,255,0.9);
  border:none;
  border-radius:50px;
  padding:6px 12px;
  font-size:.82rem;
  font-weight:bold;
  color:#888;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,0.15);
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.home-btn:active { opacity:.75; }

/* ===== DASH & JUMP WRAPPER ===== */
#game-dashjump {
  position:relative;
  background:#b8e4f9;
  justify-content:center;
  align-items:center;
}
#game-dashjump.active { display:flex; }

/* ===== IROMAZE WRAPPER ===== */
#game-iromaze {
  position:relative;
  background:#f0eeea;
}
#game-iromaze.active { display:block; }

/* ===== IROMAZE SCOPED CSS ===== */
#game-iromaze .screen { display:none; min-height:100vh; flex-direction:column; align-items:center; }
#game-iromaze .screen.active { display:flex; }

#game-iromaze #charScreen { padding:20px 16px 30px; gap:16px; justify-content:center; }
#game-iromaze .screen-title { font-size:1.5rem; color:#666; font-weight:bold; letter-spacing:.05em; text-align:center; }
#game-iromaze .char-grid {
  display:grid; grid-template-columns:repeat(3,1fr);
  gap:12px; width:100%; max-width:380px;
}
#game-iromaze .char-card {
  background:white; border-radius:20px; padding:12px 8px 10px;
  display:flex; flex-direction:column; align-items:center; gap:6px;
  box-shadow:0 4px 14px rgba(0,0,0,.10); cursor:pointer;
  transition:transform .12s; border:3px solid transparent;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
#game-iromaze .char-card:active { transform:scale(.92); }
#game-iromaze .char-card span { font-size:.8rem; font-weight:bold; color:#555; white-space:nowrap; }

#game-iromaze #mixScreen { padding:16px 16px 32px; justify-content:space-between; }
#game-iromaze .mix-top {
  display:flex; align-items:center; justify-content:center;
  gap:12px; width:100%;
}
#game-iromaze .mix-title { font-size:1.4rem; color:#666; font-weight:bold; }
#game-iromaze .pot-area {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:14px;
}
#game-iromaze .pot-circle {
  width:220px; height:220px; border-radius:50%;
  background:#d8d5d0;
  box-shadow:0 8px 28px rgba(0,0,0,.18),inset 0 -4px 12px rgba(0,0,0,.10);
  transition:background .45s ease;
}
#game-iromaze .color-name { font-size:1.5rem; font-weight:bold; color:#444; min-height:2rem; text-align:center; }
#game-iromaze .drops-info { font-size:.85rem; color:#999; text-align:center; min-height:1.1em; }
#game-iromaze .buttons-area { width:100%; max-width:400px; }
#game-iromaze .color-buttons { display:flex; gap:10px; justify-content:center; margin-bottom:10px; }
#game-iromaze .color-btn {
  width:56px; height:56px; border-radius:50%;
  border:3px solid rgba(255,255,255,.65); cursor:pointer;
  font-size:.75rem; font-weight:bold; color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.35);
  box-shadow:0 4px 14px rgba(0,0,0,.22);
  transition:transform .12s;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
#game-iromaze .color-btn:active { transform:scale(.86); }
#game-iromaze .action-buttons { display:flex; gap:10px; }
#game-iromaze .reset-btn {
  flex:1; padding:15px; border:none; border-radius:18px;
  background:#b0aaa4; color:#fff; font-size:1.05rem; font-weight:bold;
  cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.12);
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
#game-iromaze .reset-btn:active { opacity:.8; }
#game-iromaze .finish-btn {
  flex:2; padding:15px; border:none; border-radius:18px;
  background:linear-gradient(135deg,#ff8fab,#ffb347);
  color:#fff; font-size:1.2rem; font-weight:bold; cursor:pointer;
  box-shadow:0 4px 18px rgba(255,140,100,.4);
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  letter-spacing:.05em;
}
#game-iromaze .finish-btn:active { opacity:.85; transform:scale(.97); }

#game-iromaze #resultScreen {
  padding:0; justify-content:center;
  position:fixed; top:0; left:0; right:0; bottom:0;
  background:#f0eeea; z-index:100;
}
#game-iromaze #resultCanvas { display:block; }
#game-iromaze .result-btns {
  position:fixed; bottom:42px; left:50%; transform:translateX(-50%);
  display:none; gap:12px; z-index:101;
}
#game-iromaze .result-back-btn {
  padding:14px 28px; border:none; border-radius:50px;
  background:#b0aaa4; color:#fff; font-size:1.05rem; font-weight:bold;
  cursor:pointer; box-shadow:0 4px 18px rgba(0,0,0,.18);
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  white-space:nowrap;
}

@keyframes iro-pop {
  0%{transform:scale(1)} 50%{transform:scale(1.09)} 100%{transform:scale(1)}
}
#game-iromaze .pop { animation:iro-pop .28s ease; }

/* ===== HOME ADDITIONS ===== */
.home-section-label {
  font-size:.85rem;font-weight:bold;color:#ccc;letter-spacing:.1em;
  margin:22px 0 10px;text-align:center;width:100%;max-width:400px;
}
.game-grid-3 {
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:12px;width:100%;max-width:380px;
}
.tile-moji{background:linear-gradient(140deg,#a78bfa,#7c3aed);box-shadow:0 8px 20px rgba(124,58,237,.3);}
.tile-eigo{background:linear-gradient(140deg,#34d399,#059669);box-shadow:0 8px 20px rgba(5,150,105,.3);}
.tile-suji{background:linear-gradient(140deg,#60a5fa,#2563eb);box-shadow:0 8px 20px rgba(37,99,235,.3);}
.game-tile.tile-moji .game-tile-name{color:white;}
.game-tile.tile-eigo .game-tile-name{color:white;}
.game-tile.tile-suji .game-tile-name{color:white;}
.game-tile-small{padding:20px 8px 16px;gap:8px;}
.game-tile-small .game-tile-icon{font-size:2.2rem;}
.game-tile-small .game-tile-name{font-size:.92rem;}

/* ===== CATEGORY SCREEN ===== */
#screen-category {
  display:none;min-height:100vh;
  background:linear-gradient(135deg,#ffe0f0 0%,#fff0b0 40%,#b0f0ff 100%);
  flex-direction:column;align-items:center;padding:60px 16px 32px;
}
.cat-back-btn {
  position:fixed;top:12px;left:12px;z-index:10;
  background:rgba(255,255,255,.85);border:none;border-radius:50px;
  padding:7px 14px;font-size:.82rem;font-weight:bold;color:#888;
  cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.13);
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.cat-title{font-size:2rem;font-weight:bold;color:#555;margin-bottom:6px;text-align:center;}
.cat-subtitle{font-size:.95rem;color:#aaa;margin-bottom:28px;text-align:center;}
.sub-game-list{display:flex;flex-direction:column;gap:13px;width:100%;max-width:360px;}
.sub-game-btn {
  background:white;border:none;border-radius:20px;padding:18px 20px;
  display:flex;align-items:center;gap:16px;
  box-shadow:0 5px 18px rgba(0,0,0,.1);cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  transition:transform .12s;
}
.sub-game-btn:active{transform:scale(.94);}
.sub-game-icon{font-size:1.9rem;width:38px;text-align:center;flex-shrink:0;font-weight:bold;}
.sub-game-info{text-align:left;}
.sub-game-name{font-size:1.05rem;font-weight:bold;color:#444;}
.sub-game-desc{font-size:.78rem;color:#aaa;margin-top:2px;}

/* ===== KNOWLEDGE GAME ===== */
#game-chishiki {
  display:none;min-height:100vh;
  background:linear-gradient(160deg,#fef9ff 0%,#f0f8ff 100%);
  flex-direction:column;align-items:center;justify-content:flex-start;
  padding:60px 16px 32px;position:relative;
}
#game-chishiki.active{display:flex;}
#ch-game-area{display:flex;flex-direction:column;align-items:center;width:100%;gap:18px;}
.ch-top-bar {
  position:fixed;top:10px;left:0;right:0;
  display:flex;align-items:center;padding:0 12px;gap:8px;z-index:5;
}
.ch-home-btn {
  background:rgba(255,255,255,.88);border:none;border-radius:50px;
  padding:7px 14px;font-size:.82rem;font-weight:bold;color:#888;
  cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.13);
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;white-space:nowrap;
}
.ch-progress{flex:1;height:8px;border-radius:99px;background:#eee;overflow:hidden;}
.ch-progress-inner{height:100%;border-radius:99px;background:linear-gradient(90deg,#ff8fab,#ffb347);transition:width .3s;}
.ch-score{font-size:.88rem;font-weight:bold;color:#aaa;white-space:nowrap;}
.ch-question-card {
  background:white;border-radius:28px;padding:26px 20px;
  width:100%;max-width:360px;display:flex;flex-direction:column;
  align-items:center;box-shadow:0 8px 28px rgba(0,0,0,.09);gap:8px;
}
.ch-q-label{font-size:1.05rem;color:#e060a0;font-weight:bold;letter-spacing:.04em;text-align:center;}
.ch-q-main{font-weight:bold;color:#333;line-height:1.1;text-align:center;}
.ch-choices{display:flex;flex-direction:column;gap:11px;width:100%;max-width:360px;}
.ch-choice-btn {
  background:white;border:2.5px solid #eee;border-radius:18px;
  padding:14px;font-size:1.3rem;font-weight:bold;color:#444;
  cursor:pointer;text-align:center;line-height:1.5;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  transition:transform .1s;word-break:break-all;
  min-height:58px;width:100%;flex-shrink:0;
}
.ch-choice-btn:active{transform:scale(.96);}
.ch-choice-btn.correct{background:#d4edda;border-color:#4caf50;color:#2e7d32;}
.ch-choice-btn.wrong{background:#fde8e8;border-color:#ef5350;color:#c62828;}

/* Audio / Letter cards */
.ch-audio-choices{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px;}
.ch-audio-card{
  background:white;border:2.5px solid #eee;border-radius:20px;
  padding:12px 16px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  transition:transform .1s;height:72px;width:100%;flex-shrink:0;
}
.ch-audio-card:active{transform:scale(.96);}
.ch-audio-card.correct{background:#d4edda;border-color:#4caf50;}
.ch-audio-card.wrong{background:#fde8e8;border-color:#ef5350;}
.ch-audio-card-emoji{font-size:2.6rem;line-height:1;}
.ch-speak-btn{font-size:3.5rem;background:#f0f4ff;border:3px solid #b0c4ff;border-radius:50%;width:88px;height:88px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(100,140,255,.25);}
.ch-speak-btn:active{transform:scale(.9);}

/* Narabe */
.narabe-area{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:360px;}
.narabe-slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center;}
.narabe-slot {
  width:50px;height:50px;border-radius:14px;background:white;
  border:2.5px solid #ddd;display:flex;align-items:center;justify-content:center;
  font-size:1.5rem;font-weight:bold;color:#333;
}
.narabe-slot.filled{border-color:#ff8fab;background:#fff0f5;}
.narabe-slot.correct{border-color:#4caf50;background:#d4edda;color:#2e7d32;}
.narabe-slot.wrong{border-color:#ef5350;background:#fde8e8;color:#c62828;}
.narabe-tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.narabe-tile {
  width:50px;height:50px;border-radius:14px;
  background:linear-gradient(135deg,#ff8fab,#ffb347);
  color:white;display:flex;align-items:center;justify-content:center;
  font-size:1.5rem;font-weight:bold;cursor:pointer;
  box-shadow:0 4px 12px rgba(255,140,100,.3);
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  transition:transform .1s,opacity .15s;
}
.narabe-tile:active{transform:scale(.88);}
.narabe-tile.used{opacity:.2;pointer-events:none;}
.narabe-round{font-size:.85rem;color:#ccc;font-weight:bold;}

/* Kazu narabe */
.kazu-instruction{font-size:1.05rem;font-weight:bold;color:#e060a0;text-align:center;}
.kazu-grid{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,58px);gap:10px;width:100%;max-width:340px;}
.kazu-btn {
  width:100% !important;height:58px !important;
  min-height:58px !important;max-height:58px !important;
  border:none !important;border-radius:16px;font-size:1.5rem;font-weight:bold;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  box-shadow:0 4px 14px rgba(0,0,0,.1);
  flex-shrink:0;overflow:hidden;
}
.kazu-btn:active{opacity:.75;}
.kazu-btn.pending{background:white;color:#555;}
.kazu-btn.done{background:#4caf50;color:white;}
@keyframes kazu-wrong{0%,100%{background:white;color:#555;}50%{background:#ef5350;color:white;}}
.kazu-btn.flash-wrong{animation:kazu-wrong .4s;}

/* Result */
#ch-result {
  display:none;flex-direction:column;align-items:center;justify-content:center;
  width:100%;gap:18px;padding:32px 16px;
  position:fixed;top:0;left:0;right:0;bottom:0;z-index:10;
  background:linear-gradient(160deg,#fef9ff 0%,#f0f8ff 100%);
}
#ch-result.active{display:flex;}
.ch-result-emoji{font-size:5rem;}
.ch-result-score{font-size:2.8rem;font-weight:bold;color:#e060a0;}
.ch-result-msg{font-size:1.1rem;color:#aaa;text-align:center;}
.ch-result-btns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:280px;margin-top:8px;}
.ch-retry-btn {
  padding:16px;border:none;border-radius:50px;
  background:linear-gradient(135deg,#ff8fab,#ffb347);
  color:white;font-size:1.1rem;font-weight:bold;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  box-shadow:0 4px 18px rgba(255,140,100,.35);
}
.ch-home-btn2 {
  padding:14px;border:2px solid #ddd;border-radius:50px;
  background:white;color:#888;font-size:1rem;font-weight:bold;
  cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
}

#game-iromaze #modeScreen { padding:30px 20px 40px; gap:20px; justify-content:center; }
#game-iromaze .mode-title { font-size:2rem; font-weight:bold; color:#e06090; text-align:center; letter-spacing:.04em; line-height:1.25; }
#game-iromaze .mode-subtitle { font-size:1.05rem; color:#999; text-align:center; }
#game-iromaze .mode-buttons { display:grid; grid-template-columns:1fr 1fr; gap:16px; width:100%; max-width:380px; }
#game-iromaze .mode-btn {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:10px; padding:26px 10px 22px; border:none; border-radius:26px;
  cursor:pointer; box-shadow:0 6px 22px rgba(0,0,0,.15);
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  transition:transform .12s;
}
#game-iromaze .mode-btn:active { transform:scale(.91); }
#game-iromaze .mode-free { background:linear-gradient(145deg,#ffb0d6,#ffcc70); }
#game-iromaze .mode-quiz { background:linear-gradient(145deg,#74caff,#b08aff); }
#game-iromaze .mode-btn-icon { font-size:3rem; line-height:1; }
#game-iromaze .mode-btn-name { font-size:1.2rem; font-weight:bold; color:#fff; text-align:center; line-height:1.35; text-shadow:0 1px 4px rgba(0,0,0,.22); }
#game-iromaze .mode-btn-age { font-size:.78rem; color:rgba(255,255,255,.9); font-weight:bold; background:rgba(0,0,0,.14); padding:3px 12px; border-radius:20px; }

#game-iromaze #quizBanner {
  width:100%; max-width:400px;
  background:white; border-radius:18px; padding:10px 16px 12px;
  box-shadow:0 3px 12px rgba(0,0,0,.10);
  flex-direction:column; align-items:center; gap:5px;
  display:none;
}
#game-iromaze .quiz-label { font-size:.78rem; color:#bbb; font-weight:bold; letter-spacing:.06em; }
#game-iromaze .quiz-target-row { display:flex; align-items:center; gap:10px; }
#game-iromaze .quiz-swatch { width:34px; height:34px; border-radius:50%; box-shadow:0 2px 8px rgba(0,0,0,.2); flex-shrink:0; }
#game-iromaze .quiz-target-name { font-size:1.5rem; font-weight:bold; color:#444; }
#game-iromaze .quiz-hint { font-size:.82rem; color:#bbb; }

#game-iromaze .result-retry-btn {
  padding:14px 28px; border:none; border-radius:50px;
  background:linear-gradient(135deg,#ff8fab,#ffb347);
  color:#fff; font-size:1.05rem; font-weight:bold;
  cursor:pointer; box-shadow:0 4px 18px rgba(255,140,100,.35);
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  white-space:nowrap;
}
</style>
</head>
<body>

<!-- ===== HOME SCREEN ===== -->
<div id="screen-home">
  <div class="home-title">PLAYCO</div>
  <div class="home-subtitle">SELECT YOUR GAME</div>
  <div class="game-grid">
    <div class="game-tile tile-dash" onclick="showGame('dashjump')" ontouchstart="">
      <div class="game-tile-icon">🏃</div>
      <div class="game-tile-name">ゲーム</div>
    </div>
    <div class="game-tile tile-iro" onclick="showGame('iromaze')" ontouchstart="">
      <div class="game-tile-icon">🎨</div>
      <div class="game-tile-name">いろまぜ</div>
    </div>
  </div>
  <div class="game-grid-3">
    <div class="game-tile game-tile-small tile-moji" onclick="chShowCategory('moji')" ontouchstart="">
      <div class="game-tile-icon">📝</div>
      <div class="game-tile-name">もじ</div>
    </div>
    <div class="game-tile game-tile-small tile-eigo" onclick="chShowCategory('eigo')" ontouchstart="">
      <div class="game-tile-icon">🌏</div>
      <div class="game-tile-name">えいご</div>
    </div>
    <div class="game-tile game-tile-small tile-suji" onclick="chShowCategory('suji')" ontouchstart="">
      <div class="game-tile-icon">🔢</div>
      <div class="game-tile-name">すうじ</div>
    </div>
  </div>
</div>

<!-- ===== DASH & JUMP GAME ===== -->
<div id="game-dashjump">
  <button class="home-btn" onclick="showHome()" ontouchstart="">🏠 ホーム</button>
  <canvas id="c"></canvas>
</div>

<!-- ===== IROMAZE GAME ===== -->
<div id="game-iromaze">
  <!-- Screen 0: モード選択 -->
  <div class="screen active" id="modeScreen" style="position:relative;">
    <button class="home-btn" onclick="showHome()" ontouchstart="">🏠 ホーム</button>
    <div class="mode-title">🎨 いろまぜゲーム</div>
    <div class="mode-subtitle">モードをえらんでね！</div>
    <div class="mode-buttons">
      <button class="mode-btn mode-free" ontouchstart="" onclick="iroStartFreeMode()">
        <span class="mode-btn-icon">🌈</span>
        <span class="mode-btn-name">じゆうに<br>まぜまぜ</span>
      </button>
      <button class="mode-btn mode-quiz" ontouchstart="" onclick="iroStartQuizMode()">
        <span class="mode-btn-icon">⭐</span>
        <span class="mode-btn-name">いろ<br>クイズ</span>
      </button>
    </div>
  </div>

  <!-- Screen 1: キャラ選択 -->
  <div class="screen" id="charScreen">
    <div class="screen-title">🌟 キャラクターをえらんでね！</div>
    <div class="char-grid" id="charGrid"></div>
  </div>

  <!-- Screen 2: まぜまぜ -->
  <div class="screen" id="mixScreen">
    <div class="mix-top">
      <canvas id="selectedCharSmall" width="48" height="48"></canvas>
      <div class="mix-title">🪄 まほうのツボ</div>
    </div>
    <div id="quizBanner">
      <div class="quiz-label">🎯 めざせ！</div>
      <div class="quiz-target-row">
        <div class="quiz-swatch" id="quizSwatch"></div>
        <div class="quiz-target-name" id="quizTargetName" style="display:none"></div>
      </div>
      <div class="quiz-hint" id="quizHint"></div>
    </div>
    <div class="pot-area">
      <div class="pot-circle" id="pot"></div>
      <div class="color-name" id="colorName">いろをまぜてみよう！</div>
      <div class="drops-info" id="dropsInfo"></div>
    </div>
    <div class="buttons-area">
      <div class="color-buttons">
        <button class="color-btn" style="background:#FF4444" ontouchstart="" onclick="iroAddColor('red')">あか</button>
        <button class="color-btn" style="background:#4488FF" ontouchstart="" onclick="iroAddColor('blue')">あお</button>
        <button class="color-btn" style="background:#FFD700;color:#666;text-shadow:none" ontouchstart="" onclick="iroAddColor('yellow')">きいろ</button>
        <button class="color-btn" style="background:#FFFFFF;color:#aaa;text-shadow:none;border-color:#ddd" ontouchstart="" onclick="iroAddColor('white')">しろ</button>
        <button class="color-btn" style="background:#333333" ontouchstart="" onclick="iroAddColor('black')">くろ</button>
      </div>
      <div class="action-buttons">
        <button class="reset-btn" ontouchstart="" onclick="iroResetPot()">もどす</button>
        <button class="finish-btn" ontouchstart="" onclick="iroShowResult()">かんせい！</button>
      </div>
    </div>
  </div>

  <!-- Screen 3: リザルト -->
  <div class="screen" id="resultScreen">
    <canvas id="resultCanvas"></canvas>
    <div class="result-btns" id="resultBtns">
      <button class="result-retry-btn" id="retryBtn" onclick="iroRetryQuiz()">もういちど</button>
      <button class="result-back-btn" id="backBtn" onclick="iroGoBack()">スタートにもどる</button>
    </div>
  </div>
</div>

<!-- ===== CATEGORY SCREEN ===== -->

  <button class="cat-back-btn" onclick="chShowHome()" ontouchstart="">🏠 ホーム</button>
  <div class="cat-title" id="cat-title"></div>

<!-- ===== HOME NAVIGATION SCRIPT ===== -->
<script>
function showHome(){
  document.getElementById('screen-home').style.display='flex';
  document.getElementById('game-dashjump').classList.remove('active');
  document.getElementById('game-iromaze').classList.remove('active');
  document.getElementById('game-dashjump').style.display='none';
  document.getElementById('game-iromaze').style.display='none';
  document.getElementById('screen-category').style.display='none';
  document.getElementById('game-chishiki').classList.remove('active');
  document.getElementById('game-chishiki').style.display='none';
  document.getElementById('ch-result').classList.remove('active');
}
function showGame(id){
  document.getElementById('screen-home').style.display='none';
  if(id==='dashjump'){
    document.getElementById('game-dashjump').style.display='flex';
    document.getElementById('game-dashjump').classList.add('active');
    document.getElementById('game-iromaze').style.display='none';
    document.getElementById('game-iromaze').classList.remove('active');
    if(typeof djResize==='function') djResize();
  } else {
    document.getElementById('game-iromaze').style.display='block';
    document.getElementById('game-iromaze').classList.add('active');
    document.getElementById('game-dashjump').style.display='none';
    document.getElementById('game-dashjump').classList.remove('active');
  }
}
</script>

<!-- ===== DASH & JUMP SCRIPT ===== -->
<script>
(function(){
  const cv=document.getElementById('c'),cx=cv.getContext('2d');
  let W,H;
  function djResize(){
    if(window.innerWidth<=520){
      W=window.innerWidth; H=window.innerHeight;
      cv.width=W; cv.height=H;
      cv.style.width=''; cv.style.height='';
    } else {
      W=480; H=860;
      cv.width=W; cv.height=H;
      const scale=Math.min(window.innerWidth/W, window.innerHeight/H);
      cv.style.width=(W*scale)+'px';
      cv.style.height=(H*scale)+'px';
    }
  }
  window.djResize=djResize;
  djResize();
  window.addEventListener('resize',djResize);

  let screen='title';
  let difficulty='easy';
  let selChar=null;
  let score=0;
  let maxScore=0;
  let rainbowPlaced=0;
  const MAX_RAINBOW=3;
  let gameStartTime=0;
  const MAX_PLAYS=30;
  const COOLDOWN_MS=10*60*1000;
  let lockedAt=parseInt(localStorage.getItem('dashJumpLockedAt')||'0');
  if(lockedAt && Date.now()-lockedAt>=COOLDOWN_MS){
    localStorage.removeItem('dashJumpPlayCount');
    localStorage.removeItem('dashJumpLockedAt');
    lockedAt=0;
  }
  let playCount=parseInt(localStorage.getItem('dashJumpPlayCount')||'0');
  const GAME_SEC=30;

  const DIFF={
    easy:  {spd:2.5, holeP:0.12, spikeP:0.00, floatP:0.20, floatH:[-80],           holeGap:30},
    normal:{spd:4.0, holeP:0.22, spikeP:0.10, floatP:0.35, floatH:[-65,-95,-125],  holeGap:50},
    hard:  {spd:4.5, holeP:0.24, spikeP:0.18, floatP:0.40, floatH:[-60,-90,-120,-155], holeGap:70}
  };

  const CHARS=[
    {id:'car',     name:'くるま',      col:'#FF6B6B', item:'tire',  iname:'タイヤ',    emoji:'🚗', itemEmoji:'🛞', flip:true},
    {id:'dino',    name:'きょうりゅう', col:'#6BCB77', item:'egg',   iname:'たまご',    emoji:'🦕', itemEmoji:'🥚', flip:true},
    {id:'cat',     name:'ねこ',        col:'#FFB347', item:'fish',  iname:'さかな',    emoji:'🐈', itemEmoji:'🐟', flip:true},
    {id:'dog',     name:'いぬ',        col:'#C8A876', item:'bone',  iname:'ほね',      emoji:'🐕', itemEmoji:'🦴', flip:true},
    {id:'princess',name:'ようせい',    col:'#FF9EC4', item:'candy', iname:'キャンディ', emoji:'🧚', itemEmoji:'🍬', flip:false},
    {id:'alien',   name:'うちゅうじん',col:'#B8F5B8', item:'star',  iname:'ほし',      emoji:'🛸', itemEmoji:'⭐', flip:true},
  ];

  const PW=38,PH=44;
  let pl={x:90,y:0,vy:0,jumps:0,inv:0,onGround:false};
  const GRAV=0.52, JF=-13.5;

  let bgOff=0,nextX=0;
  let platforms=[],items=[],spikes=[];
  let particles=[];
  let clouds=[];
  let buttons=[];

  function gY(){return H*0.70;}

  function initClouds(){
    clouds=[];
    for(let i=0;i<6;i++) clouds.push({
      x:Math.random()*W*2.5, y:H*0.05+Math.random()*H*0.30,
      w:55+Math.random()*70, spd:0.25+Math.random()*0.4
    });
  }
  function drawCloud(x,y,w){
    cx.fillStyle='rgba(255,255,255,0.82)';
    cx.beginPath();cx.arc(x,y,w*.30,0,Math.PI*2);cx.fill();
    cx.beginPath();cx.arc(x+w*.22,y-w*.10,w*.24,0,Math.PI*2);cx.fill();
    cx.beginPath();cx.arc(x+w*.42,y,w*.28,0,Math.PI*2);cx.fill();
  }

  function initWorld(){
    platforms=[];items=[];spikes=[];nextX=0;bgOff=0;particles=[];maxScore=0;rainbowPlaced=0;
    const gy=gY();
    platforms.push({x:0,y:gy,w:W*1.2,h:H-gy,type:'g'});
    nextX=W*1.2;
    genUntil(bgOff+W*3);
  }
  function genUntil(upTo){
    const d=DIFF[difficulty],gy=gY();
    while(nextX<upTo){
      const sw=70+Math.random()*70;
      const isHole=Math.random()<d.holeP && nextX>W*1.4;
      if(!isHole){
        platforms.push({x:nextX,y:gy,w:sw,h:H-gy,type:'g'});
        let floatY=null;
        if(Math.random()<d.floatP){
          floatY=gy+d.floatH[Math.floor(Math.random()*d.floatH.length)];
          platforms.push({x:nextX+8,y:floatY,w:sw-16,h:14,type:'p'});
        }
        if(Math.random()<0.65){
          const onFloat=floatY!==null&&Math.random()<0.40;
          const isRainbow=rainbowPlaced<MAX_RAINBOW && nextX>W*1.5 && Math.random()<0.08;
          if(isRainbow) rainbowPlaced++;
          items.push({
            x:nextX+sw/2,
            y:onFloat?(floatY-30):(gy-58-Math.random()*40),
            done:false, bob:Math.random()*Math.PI*2,
            rainbow:isRainbow
          });
          maxScore+=isRainbow?100:10;
        }
        if(Math.random()<d.spikeP){
          spikes.push({x:nextX+10+Math.random()*(sw-28),y:gy-22,w:22,h:22});
        }
        nextX+=sw;
      } else {
        const gap=20+Math.random()*d.holeGap;
        nextX+=gap;
      }
    }
  }
  function cleanWorld(){
    const cut=bgOff-150;
    platforms=platforms.filter(p=>p.x+p.w>cut);
    items=items.filter(i=>i.x>cut);
    spikes=spikes.filter(s=>s.x>cut);
  }

  function rr(x,y,w,h,r,fill,stroke,lw){
    cx.beginPath();cx.roundRect(x,y,w,h,r);
    if(fill){cx.fillStyle=fill;cx.fill();}
    if(stroke){cx.strokeStyle=stroke;cx.lineWidth=lw||3;cx.stroke();}
  }
  function star5(x,y,ro,ri,col){
    cx.fillStyle=col||'#FFD700';
    cx.strokeStyle='#FFA500';cx.lineWidth=1.5;
    let a=-Math.PI/2;const st=Math.PI/5;
    cx.beginPath();
    for(let i=0;i<10;i++){
      const r=i%2===0?ro:ri;
      cx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);
      a+=st;
    }
    cx.closePath();cx.fill();cx.stroke();
  }

  function drawItemAt(x,y,type){
    const c=CHARS.find(c=>c.item===type);
    const emoji=c?c.itemEmoji:'⭐';
    cx.font='28px serif';
    cx.textAlign='center';cx.textBaseline='middle';
    cx.fillText(emoji,x,y);
  }
  function drawChar(id,flash){
    if(flash&&Math.floor(Date.now()/110)%2===0)return;
    const c=CHARS.find(c=>c.id===id);
    if(!c)return;
    cx.font='52px serif';
    cx.textAlign='center';cx.textBaseline='middle';
    if(c.flip){cx.save();cx.scale(-1,1);cx.fillText(c.emoji,0,-28);cx.restore();}
    else cx.fillText(c.emoji,0,-28);
  }

  function drawBG(){
    const g=cx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#c2eeff');g.addColorStop(.7,'#d8f8ff');g.addColorStop(1,'#c8f0e0');
    cx.fillStyle=g;cx.fillRect(0,0,W,H);
    cx.fillStyle='rgba(140,215,140,0.35)';
    for(let i=0;i<6;i++){
      const hx=((i*220)-bgOff*.25)%(W+300)-150;
      cx.beginPath();cx.arc(hx,H*.78,110,0,Math.PI,true);cx.fill();
    }
    for(const c of clouds) drawCloud(c.x-bgOff*c.spd,c.y,c.w);
  }

  function drawPlatforms(){
    for(const p of platforms){
      const px=p.x-bgOff;
      if(px+p.w<-10||px>W+10)continue;
      if(p.type==='g'){
        cx.fillStyle='#5cb85c';cx.fillRect(px,p.y,p.w,9);
        cx.fillStyle='#7a4f1e';cx.fillRect(px,p.y+9,p.w,p.h-9);
        cx.fillStyle='#4a9a4a';
        for(let t=0;t<p.w;t+=18){
          cx.beginPath();cx.arc(px+t+6,p.y,5,Math.PI,0,true);cx.fill();
        }
      } else {
        cx.fillStyle='#7B5C2A';cx.fillRect(px,p.y,p.w,p.h);
        cx.fillStyle='#5cb85c';cx.fillRect(px,p.y,p.w,6);
      }
    }
  }

  function drawSpikes(){
    cx.fillStyle='#999';cx.strokeStyle='#666';cx.lineWidth=1.5;
    for(const s of spikes){
      const sx=s.x-bgOff;
      if(sx+s.w<0||sx>W)continue;
      cx.beginPath();cx.moveTo(sx,s.y+s.h);cx.lineTo(sx+s.w/2,s.y);cx.lineTo(sx+s.w,s.y+s.h);
      cx.fill();cx.stroke();
      cx.strokeStyle='rgba(255,255,255,0.5)';cx.lineWidth=1;
      cx.beginPath();cx.moveTo(sx+s.w*.2,s.y+s.h*.7);cx.lineTo(sx+s.w/2,s.y+s.h*.1);cx.stroke();
    }
  }

  function drawItems(t){
    for(const it of items){
      if(it.done)continue;
      const ix=it.x-bgOff;
      if(ix<-30||ix>W+30)continue;
      const iy=it.y+Math.sin(t*.0028+it.bob)*6;
      cx.save();
      if(it.rainbow){
        const hue=((Date.now()/8)%360);
        cx.shadowColor=`hsl(${hue},100%,55%)`;cx.shadowBlur=20;
        cx.font='36px serif';
        cx.textAlign='center';cx.textBaseline='middle';
        cx.fillText('🌟',ix,iy);
      } else {
        cx.shadowColor='#FFD700';cx.shadowBlur=12;
        drawItemAt(ix,iy,selChar?.item||'star');
      }
      cx.restore();
    }
  }

  function addParticle(x,y,txt,col){
    particles.push({x,y,vy:-3,vx:(Math.random()-.5)*4,life:55,txt:txt||'+10',col:col||'#FFD700'});
  }
  function updateParticles(){
    particles=particles.filter(p=>p.life>0);
    for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy*=.96;p.life--;}
  }
  function drawParticles(){
    cx.textAlign='center';
    for(const p of particles){
      cx.globalAlpha=p.life/55;
      cx.fillStyle=p.col;cx.font=`bold ${Math.round(W*.052)}px sans-serif`;
      cx.fillText(p.txt,p.x,p.y);
    }
    cx.globalAlpha=1;
  }

  function updateGame(){
    const d=DIFF[difficulty],gy=gY();
    bgOff+=d.spd;
    genUntil(bgOff+W*3);
    cleanWorld();

    pl.vy+=GRAV;
    pl.y+=pl.vy;
    if(pl.inv>0)pl.inv--;

    pl.onGround=false;
    for(const p of platforms){
      if(!p.type)continue;
      const px=p.x-bgOff;
      const pl_l=pl.x-PW/2,pl_r=pl.x+PW/2;
      if(pl_r>px&&pl_l<px+p.w){
        const feet=pl.y,prev=pl.y-pl.vy;
        if(prev<=p.y&&feet>=p.y&&pl.vy>=0){
          pl.y=p.y;pl.vy=0;pl.jumps=0;pl.onGround=true;
        }
      }
    }

    if(pl.y>gy+120){
      score=Math.max(0,score-5);
      addParticle(pl.x,gy-30,'-5','#FF6B6B');
      pl.y=gy;pl.vy=JF*.55;pl.inv=80;pl.jumps=1;
    }

    if(pl.inv<=0){
      for(const s of spikes){
        const sx=s.x-bgOff;
        if(pl.x+PW/2>sx&&pl.x-PW/2<sx+s.w&&pl.y>s.y&&pl.y-PH<s.y+s.h){
          score=Math.max(0,score-3);
          addParticle(pl.x,pl.y-30,'-3','#FF6B6B');
          pl.vy=JF*.65;pl.inv=100;
        }
      }
    }

    for(const it of items){
      if(it.done)continue;
      const ix=it.x-bgOff;
      const dist=Math.hypot(pl.x-ix,pl.y-PH/2-it.y);
      if(dist<28){
        it.done=true;
        if(it.rainbow){score+=100;addParticle(ix,it.y,'+100','#FF44FF');}
        else{score+=10;addParticle(ix,it.y,'+10','#FFD700');}
      }
    }

    updateParticles();

    if((Date.now()-gameStartTime)/1000>=GAME_SEC){
      playCount++;
      localStorage.setItem('dashJumpPlayCount',playCount);
      if(playCount>=MAX_PLAYS && !lockedAt){
        lockedAt=Date.now();
        localStorage.setItem('dashJumpLockedAt',lockedAt);
      }
      screen='result';
    }
  }

  function drawGameScreen(t){
    drawBG();
    drawPlatforms();
    drawSpikes();
    drawItems(t);

    cx.save();
    cx.translate(pl.x,pl.y);
    drawChar(selChar.id,pl.inv>0);
    cx.restore();

    drawParticles();

    const gy=gY();
    const tzY=gy+12;
    cx.strokeStyle='rgba(80,160,255,0.4)';cx.lineWidth=2;cx.setLineDash([10,7]);
    cx.strokeRect(2,tzY+2,W-4,H-tzY-4);cx.setLineDash([]);
    cx.font=`${Math.round(W*.13)}px serif`;
    cx.textAlign='center';cx.textBaseline='middle';
    cx.fillText('👆',W/2,tzY+(H-tzY)*.52);
    cx.textBaseline='alphabetic';
    cx.textAlign='left';

    rr(4,4,W-8,54,12,'rgba(255,255,255,0.75)',null);
    cx.fillStyle='#FF5555';cx.font=`bold ${Math.round(W*.056)}px sans-serif`;
    cx.fillText(`スコア：${score}`,12,43);

    const elapsed=(Date.now()-gameStartTime)/1000;
    const rem=Math.max(0,GAME_SEC-elapsed);
    const barX=W*.44,barW=W*.52,barY=16,barH=17;
    cx.fillStyle='#ddd';cx.fillRect(barX,barY,barW,barH);
    const tc=rem>12?'#6BCB77':rem>6?'#FFD166':'#FF6B6B';
    cx.fillStyle=tc;cx.fillRect(barX,barY,(rem/GAME_SEC)*barW,barH);
    cx.strokeStyle='#bbb';cx.lineWidth=1.5;cx.strokeRect(barX,barY,barW,barH);
    cx.fillStyle='#333';cx.font=`bold ${Math.round(W*.04)}px sans-serif`;
    cx.textAlign='right';cx.fillText(`${Math.ceil(rem)}秒`,W-6,40);cx.textAlign='left';
  }

  function drawTitle(){
    drawBG();

    cx.textAlign='center';
    cx.shadowColor='rgba(255,180,180,0.7)';cx.shadowBlur=18;
    cx.fillStyle='#FF5555';cx.font=`bold ${Math.round(W*.11)}px 'Hiragino Maru Gothic Pro',sans-serif`;
    cx.fillText('Dash & Jump!',W/2,H*.18);
    cx.shadowBlur=0;

    cx.fillStyle='#666';cx.font=`bold ${Math.round(W*.054)}px 'Hiragino Maru Gothic Pro',sans-serif`;
    cx.fillText('むずかしさをえらんでね',W/2,H*.30);

    const dlist=[
      {id:'easy',  label:'かんたん',  col:'#7DD87D',brd:'#4CAF50'},
      {id:'normal',label:'ふつう',    col:'#FFD166',brd:'#FFA500'},
      {id:'hard',  label:'むずかしい',col:'#FF7B7B',brd:'#DD2222'},
    ];
    buttons=[];
    dlist.forEach((d,i)=>{
      const bw=W*.72,bh=H*.10;
      const bx=W/2-bw/2,by=H*.37+i*(bh+12);
      buttons.push({x:bx,y:by,w:bw,h:bh,action:()=>{difficulty=d.id;screen='charSelect';}});
      rr(bx,by,bw,bh,20,d.col,d.brd,3);
      cx.fillStyle='#fff';cx.font=`bold ${Math.round(W*.068)}px 'Hiragino Maru Gothic Pro',sans-serif`;
      cx.fillText(d.label,W/2,by+bh*.68);
    });

    // ? ボタン（右上）
    const qr=24,qx=W-qr-10,qy=qr+10;
    buttons.push({x:qx-qr,y:qy-qr,w:qr*2,h:qr*2,action:()=>{screen='help';}});
    cx.fillStyle='rgba(255,255,255,0.85)';cx.strokeStyle='#aaa';cx.lineWidth=2;
    cx.beginPath();cx.arc(qx,qy,qr,0,Math.PI*2);cx.fill();cx.stroke();
    cx.fillStyle='#888';cx.font=`bold ${Math.round(W*.065)}px sans-serif`;
    cx.textAlign='center';cx.textBaseline='middle';
    cx.fillText('?',qx,qy+1);
    cx.textBaseline='alphabetic';
    cx.textAlign='left';
  }

  function drawHelp(){
    cx.fillStyle='rgba(0,0,0,0.55)';cx.fillRect(0,0,W,H);

    const pw=W-48,ph=H*.78,px=(W-pw)/2,py=H*.10;
    rr(px,py,pw,ph,20,'#fff','#ddd',2);

    cx.fillStyle='#333';cx.textAlign='center';
    cx.font=`bold ${Math.round(W*.065)}px 'Hiragino Maru Gothic Pro',sans-serif`;
    cx.fillText('保護者向け説明',W/2,py+44);

    cx.strokeStyle='#eee';cx.lineWidth=1.5;
    cx.beginPath();cx.moveTo(px+20,py+58);cx.lineTo(px+pw-20,py+58);cx.stroke();

    const lines=[
      {t:'● 遊び方', bold:true},
      {t:'画面下半分をタッチするとジャンプします。'},
      {t:'アイテムを集めて得点を競います。'},
      {t:''},
      {t:'● 制限ルール', bold:true},
      {t:`・${MAX_PLAYS}回プレイすると一定時間使用不可になります。`},
      {t:`・${COOLDOWN_MS/60000}分後に自動でリセットされます。`},
      {t:'・アプリを閉じても制限は引き継がれます。'},
      {t:''},
      {t:'● 点数について', bold:true},
      {t:'・通常アイテム：+10点'},
      {t:'・光るレインボーアイテム：+100点'},
      {t:'・穴に落ちる：-5点 / トゲに当たる：-3点'},
    ];

    const maxTw=pw-40;
    const fs=Math.round(W*.040);
    const lineH=fs*1.55;
    let ly=py+82;
    for(const l of lines){
      if(!l.t){ly+=8;continue;}
      cx.fillStyle=l.bold?'#FF5555':'#444';
      cx.font=`${l.bold?'bold ':''} ${fs}px 'Hiragino Maru Gothic Pro',sans-serif`;
      cx.textAlign='left';
      const words=l.t;
      let line='';
      for(const ch of words){
        const test=line+ch;
        if(cx.measureText(test).width>maxTw){
          cx.fillText(line,px+20,ly);
          ly+=lineH;
          line=ch;
        } else line=test;
      }
      if(line) cx.fillText(line,px+20,ly);
      ly+=lineH;
    }

    buttons=[];
    const cw=W*.6,ch=48,cx2=W/2-cw/2,cy2=py+ph-62;
    buttons.push({x:cx2,y:cy2,w:cw,h:ch,action:()=>{screen='title';}});
    rr(cx2,cy2,cw,ch,14,'#FF5555','#cc2222',2);
    cx.fillStyle='#fff';cx.font=`bold ${Math.round(W*.055)}px 'Hiragino Maru Gothic Pro',sans-serif`;
    cx.textAlign='center';
    cx.fillText('とじる',W/2,cy2+32);
    cx.textAlign='left';
  }

  function drawCharSelect(){
    drawBG();
    cx.fillStyle='#FF5555';cx.font=`bold ${Math.round(W*.062)}px 'Hiragino Maru Gothic Pro',sans-serif`;
    cx.textAlign='center';cx.fillText('キャラをえらんでね！',W/2,H*.068);

    buttons=[];
    const cols=2,rows=3;
    const cw=(W-24)/cols,ch=(H*.84)/rows;
    CHARS.forEach((c,i)=>{
      const col=i%cols,row=Math.floor(i/cols);
      const bx=8+col*cw,by=H*.09+row*ch;
      const bw=cw-8,bh=ch-10;
      buttons.push({x:bx,y:by,w:bw,h:bh,action:()=>{selChar=c;startGame();}});
      rr(bx,by,bw,bh,18,'rgba(255,255,255,0.88)',c.col,3);
      cx.save();cx.translate(bx+bw/2,by+bh*0.44);
      cx.font=`${Math.round(bh*0.46)}px serif`;
      cx.textAlign='center';cx.textBaseline='middle';
      if(c.flip)cx.scale(-1,1);
      cx.fillText(c.emoji,0,0);
      cx.restore();
      cx.fillStyle='#333';cx.font=`bold ${Math.round(W*.052)}px 'Hiragino Maru Gothic Pro',sans-serif`;
      cx.fillText(c.name,bx+bw/2,by+bh*.90);
    });
    cx.textAlign='left';
  }

  function drawResult(){
    const g=cx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#fff0f8');g.addColorStop(1,'#e8f4ff');
    cx.fillStyle=g;cx.fillRect(0,0,W,H);

    const confCols=['#FF6B6B','#FFD166','#6BCB77','#FF9EC4','#88ccff','#FFB347'];
    for(let i=0;i<35;i++){
      cx.fillStyle=confCols[i%confCols.length];
      const rx=(i*97+Date.now()*.04)%(W+20)-10;
      const ry=(i*67+Date.now()*.025)%H;
      cx.save();cx.translate(rx,ry);cx.rotate(i*.6+Date.now()*.001);
      cx.fillRect(-5,-5,10,10);cx.restore();
    }

    rr(W/2-170,H*.12,340,H*.69,24,'rgba(255,255,255,0.93)','#FFB347',3);

    cx.save();
    cx.restore();
    cx.save();cx.translate(W/2,H*.32);
    cx.font=`${Math.round(H*.11)}px serif`;
    cx.textAlign='center';cx.textBaseline='middle';
    if(selChar.flip)cx.scale(-1,1);
    cx.fillText(selChar.emoji,0,0);
    cx.restore();

    cx.textAlign='center';
    cx.fillStyle='#FF5555';cx.font=`bold ${Math.round(W*.065)}px 'Hiragino Maru Gothic Pro',sans-serif`;
    cx.fillText(selChar.name+'で',W/2,H*.47);

    cx.fillStyle='#FF5555';cx.font=`bold ${Math.round(W*.10)}px 'Hiragino Maru Gothic Pro',sans-serif`;
    cx.fillText(`${score}てん`,W/2,H*.57);
    cx.fillStyle='#aaa';cx.font=`${Math.round(W*.042)}px 'Hiragino Maru Gothic Pro',sans-serif`;
    cx.fillText(`/ ${maxScore}てん`,W/2,H*.625);

    const barX=W/2-130,barY=H*.655,barW=260,barH=22,barR=11;
    const ratio=maxScore>0?Math.min(score/maxScore,1):0;
    rr(barX,barY,barW,barH,barR,'#e8e8e8',null);
    if(ratio>0){
      const fillW=Math.max(barW*ratio,barR*2);
      const grad=cx.createLinearGradient(barX,0,barX+barW,0);
      grad.addColorStop(0,'#FF6B6B');
      grad.addColorStop(0.5,'#FFD166');
      grad.addColorStop(1,'#6BCB77');
      cx.fillStyle=grad;
      cx.beginPath();cx.roundRect(barX,barY,fillW,barH,barR);cx.fill();
    }
    if(score>=maxScore&&maxScore>0){
      cx.font=`${Math.round(W*.08)}px serif`;
      cx.textAlign='center';cx.textBaseline='middle';
      cx.fillText('🏆',barX+barW+24,barY+barH/2);
    }

    cx.fillStyle='#FF88BB';cx.font=`bold ${Math.round(W*.058)}px 'Hiragino Maru Gothic Pro',sans-serif`;
    cx.textAlign='center';
    cx.fillText('ゲットしたよ！',W/2,H*.74);

    buttons=[];
    const bw=W*.72,bh=50,bx=W/2-bw/2,by=H*.03;
    buttons.push({x:bx,y:by,w:bw,h:bh,action:()=>{screen=playCount>=MAX_PLAYS?'over':'title';}});
    rr(bx,by,bw,bh,18,'#FF5555','#cc2222',3);
    cx.fillStyle='#fff';cx.font=`bold ${Math.round(W*.055)}px 'Hiragino Maru Gothic Pro',sans-serif`;
    cx.fillText('スタートにもどる',W/2,by+34);
    cx.textAlign='left';
  }

  function drawOver(){
    const g=cx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#1a1a2e');g.addColorStop(1,'#16213e');
    cx.fillStyle=g;cx.fillRect(0,0,W,H);

    cx.fillStyle='rgba(255,255,255,0.6)';
    for(let i=0;i<40;i++){
      const sx=(i*137)%W,sy=(i*97)%H*.6;
      cx.beginPath();cx.arc(sx,sy,(i%3+1)*.8,0,Math.PI*2);cx.fill();
    }

    cx.textAlign='center';
    cx.fillStyle='#FFD700';
    cx.font=`bold ${Math.round(W*.13)}px 'Hiragino Maru Gothic Pro',sans-serif`;
    cx.fillText('おつかれ！',W/2,H*.28);

    cx.fillStyle='#fff';
    cx.font=`${Math.round(W*.055)}px 'Hiragino Maru Gothic Pro',sans-serif`;
    cx.fillText(`きょうは${MAX_PLAYS}かいやったよ！`,W/2,H*.42);
    cx.fillStyle='#aac4ff';
    cx.font=`${Math.round(W*.048)}px 'Hiragino Maru Gothic Pro',sans-serif`;
    cx.fillText('またあそぼうね！',W/2,H*.52);

    cx.save();cx.translate(W/2,H*.70);
    cx.font=`${Math.round(H*.10)}px serif`;
    cx.textAlign='center';cx.textBaseline='middle';
    const _oc=selChar||CHARS[2];
    if(_oc.flip)cx.scale(-1,1);
    cx.fillText(_oc.emoji,0,0);
    cx.restore();
    cx.fillStyle='#aac4ff';
    cx.font=`bold ${Math.round(W*.07)}px sans-serif`;
    cx.fillText('Zzz…',W/2+W*.18,H*.60);

    cx.textAlign='left';
  }

  function calcStars(s){
    if(s>=160)return 5;
    if(s>=110)return 4;
    if(s>=65) return 3;
    if(s>=30) return 2;
    if(s>=10) return 1;
    return 0;
  }

  function startGame(){
    score=0;
    pl.x=90;pl.y=gY();pl.vy=0;pl.jumps=0;pl.inv=0;pl.onGround=false;
    particles=[];
    initClouds();
    initWorld();
    gameStartTime=Date.now();
    screen='game';
  }

  function handleInput(tx,ty){
    if(screen==='over') return;
    if(screen==='game'){
      if(pl.jumps<2){pl.vy=JF;pl.jumps++;pl.onGround=false;}
      return;
    }
    if(playCount>=MAX_PLAYS&&screen!=='result'){screen='over';return;}
    for(const b of buttons){
      if(tx>=b.x&&tx<=b.x+b.w&&ty>=b.y&&ty<=b.y+b.h){b.action();break;}
    }
  }
  function getXY(e,touch){
    const r=cv.getBoundingClientRect();
    const sx=W/r.width,sy=H/r.height;
    if(touch){return{x:(touch.clientX-r.left)*sx,y:(touch.clientY-r.top)*sy};}
    return{x:(e.clientX-r.left)*sx,y:(e.clientY-r.top)*sy};
  }
  cv.addEventListener('touchstart',e=>{
    e.preventDefault();
    const p=getXY(e,e.changedTouches[0]);
    handleInput(p.x,p.y);
  },{passive:false});
  cv.addEventListener('mousedown',e=>{
    const p=getXY(e);handleInput(p.x,p.y);
  });

  function loop(t){
    cx.clearRect(0,0,W,H);
    switch(screen){
      case'title':     drawTitle();break;
      case'charSelect':drawCharSelect();break;
      case'game':      updateGame();drawGameScreen(t);break;
      case'result':    drawResult();break;
      case'over':      drawOver();break;
      case'help':      drawTitle();drawHelp();break;
    }
    requestAnimationFrame(loop);
  }
  initClouds();
  if(playCount>=MAX_PLAYS) screen='over';
  requestAnimationFrame(loop);
})();
</script>

<!-- ===== IROMAZE SCRIPT ===== -->
<script>
(function(){
  // ========== DATA ==========
  const CHARS = [
    {id:'くるま',      emoji:'🚗'},
    {id:'かいじゅう',  emoji:'👾'},
    {id:'ねこ',        emoji:'🐱'},
    {id:'いぬ',        emoji:'🐶'},
    {id:'ようせい',    emoji:'🧚'},
    {id:'うちゅうじん',emoji:'👽'},
  ];
  const COLORS = {
    red:[255,68,68], blue:[68,136,255], yellow:[255,215,0],
    white:[255,255,255], black:[51,51,51],
  };
  const JP = { red:'あか',blue:'あお',yellow:'きいろ',white:'しろ',black:'くろ' };

  let selectedChar = null;
  let drops = {red:0,blue:0,yellow:0,white:0,black:0};
  let total = 0;
  let mixedColor = [200,180,180];
  let animRaf = null;

  // ========== QUIZ DATA ==========
  const QUIZ_COLORS = [
    { name:'みどり',           recipe:{blue:1,yellow:1},          hint:'あお ＋ きいろ をまぜよう！' },
    { name:'だいだいいろ',     recipe:{red:1,yellow:1},            hint:'あか ＋ きいろ をまぜよう！' },
    { name:'うすだいだいいろ', recipe:{red:1,yellow:1,white:1},   hint:'あか ＋ きいろ ＋ しろ をまぜよう！' },
    { name:'ももいろ',         recipe:{red:1,white:1},             hint:'あか ＋ しろ をまぜよう！' },
    { name:'みずいろ',         recipe:{blue:1,white:1},            hint:'あお ＋ しろ をまぜよう！' },
    { name:'きみどり',         recipe:{yellow:2,blue:1},           hint:'きいろ（おおめ）＋ あお をまぜよう！' },
    { name:'はいいろ',         recipe:{white:1,black:1},           hint:'くろ ＋ しろ をまぜよう！' },
    { name:'ちゃいろ',         recipe:{red:1,yellow:1,black:1},   hint:'あか ＋ きいろ ＋ くろ をまぜよう！' },
    { name:'むらさき',         recipe:{red:1,blue:1,white:1},     hint:'あか ＋ あお ＋ しろ をまぜよう！' },
    { name:'おうどいろ',       recipe:{yellow:2,red:1,black:1},   hint:'きいろ（おおめ）＋ あか ＋ くろ をまぜよう！' },
  ];

  function recipeToRgb(recipe){
    const rd=recipe.red||0, yd=recipe.yellow||0, bd=recipe.blue||0;
    const wd=recipe.white||0, kd=recipe.black||0;
    const ch=rd+yd+bd;
    if(ch===0){
      const g=Math.round(255*wd/(wd+kd*2));
      return [g,g,g];
    }
    let [r,g,b]=rybToRgb(rd/ch,yd/ch,bd/ch);
    if(wd>0){ const f=wd/(ch+wd); r=Math.round(r*(1-f)+255*f); g=Math.round(g*(1-f)+255*f); b=Math.round(b*(1-f)+255*f); }
    if(kd>0){ const bf=(ch+wd)/(ch+wd+kd*2); r=Math.round(r*bf); g=Math.round(g*bf); b=Math.round(b*bf); }
    return [r,g,b];
  }
  let quizMode = false;
  let currentQuiz = null;

  // ========== CHARACTER DRAWING ==========
  function drawChar(ctx, name, color, cx, cy, r) {
    const [cr,cg,cb] = color;
    const c=CHARS.find(c=>c.id===name);
    if(!c)return;
    // 一時canvasに絵文字を描いて色をsource-atopで重ねる
    const size=Math.round(r*2.6);
    const tmp=document.createElement('canvas');
    tmp.width=size; tmp.height=size;
    const tc=tmp.getContext('2d');
    tc.font=`${Math.round(r*1.3)}px serif`;
    tc.textAlign='center'; tc.textBaseline='middle';
    tc.fillText(c.emoji, size/2, size/2);
    tc.globalCompositeOperation='source-atop';
    tc.fillStyle=`rgba(${cr},${cg},${cb},0.6)`;
    tc.fillRect(0,0,size,size);
    // メインcanvasに描画
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,0.18)';ctx.shadowBlur=10;
    ctx.drawImage(tmp, cx-size/2, cy-size/2);
    ctx.restore();
  }

  // ========== MODE / QUIZ ==========
  function iroStartFreeMode(){
    quizMode=false; currentQuiz=null;
    iroInitCharSelect();
    document.getElementById('quizBanner').style.display='none';
    iroShowScreen('charScreen');
  }
  window.iroStartFreeMode=iroStartFreeMode;

  function iroStartQuizMode(){
    quizMode=true;
    currentQuiz=QUIZ_COLORS[Math.floor(Math.random()*QUIZ_COLORS.length)];
    iroInitCharSelect();
    iroUpdateQuizBanner();
    iroShowScreen('charScreen');
  }
  window.iroStartQuizMode=iroStartQuizMode;

  function iroUpdateQuizBanner(){
    const b=document.getElementById('quizBanner');
    if(!quizMode||!currentQuiz){ b.style.display='none'; return; }
    const [r,g,bl]=recipeToRgb(currentQuiz.recipe);
    document.getElementById('quizSwatch').style.background=`rgb(${r},${g},${bl})`;
    document.getElementById('quizTargetName').textContent=currentQuiz.name;
    document.getElementById('quizHint').textContent=currentQuiz.hint;
    b.style.display='flex';
  }

  function calcScore(r,g,b){
    if(!currentQuiz) return null;
    const active=Object.keys(drops).filter(k=>drops[k]>0);
    if(active.length>=4 && total>=4) return {stars:'☆☆☆',msg:'まぜすぎ！',dist:999};
    const [tr,tg,tb]=recipeToRgb(currentQuiz.recipe);
    const dist=Math.sqrt((r-tr)**2+(g-tg)**2+(b-tb)**2);
    if(dist<=80)  return {stars:'★★★',msg:'ぴったり！',dist};
    if(dist<=160) return {stars:'★★☆',msg:'とてもちかい！',dist};
    if(dist<=240) return {stars:'★☆☆',msg:'ちかい！',dist};
    return {stars:'☆☆☆',msg:'もういちど！',dist};
  }

  function iroRetryQuiz(){
    if(animRaf){cancelAnimationFrame(animRaf);animRaf=null;}
    document.getElementById('resultBtns').style.display='none';
    drops={red:0,blue:0,yellow:0,white:0,black:0}; total=0; mixedColor=[200,180,180];
    iroInitCharSelect();
    iroUpdateQuizBanner();
    iroShowScreen('charScreen');
  }
  window.iroRetryQuiz=iroRetryQuiz;

  // ========== CHAR SELECT ==========
  function iroInitCharSelect(){
    const grid=document.getElementById('charGrid');
    grid.innerHTML='';
    CHARS.forEach(c=>{
      const card=document.createElement('div');
      card.className='char-card';
      card.ontouchstart=()=>{};
      card.onclick=()=>iroSelectChar(c.id);
      const em=document.createElement('div');
      em.style.cssText='font-size:52px;line-height:1;margin-bottom:4px;';
      em.textContent=c.emoji;
      const lbl=document.createElement('span');
      lbl.textContent=c.id;
      card.appendChild(em);card.appendChild(lbl);
      grid.appendChild(card);
    });
  }

  function iroSelectChar(name){
    selectedChar=name;
    const c=CHARS.find(ch=>ch.id===name);
    const el=document.getElementById('selectedCharSmall');
    // canvasなら絵文字表示用divに切り替え
    el.style.cssText='font-size:36px;line-height:1;';
    el.textContent=c?c.emoji:'';
    iroShowScreen('mixScreen');
    iroResetPot();
    iroUpdateQuizBanner();
  }

  // ========== COLOR MIXING ==========
  function iroAddColor(key){
    drops[key]++; total++;
    iroUpdatePot();
    const pot=document.getElementById('pot');
    pot.classList.remove('pop'); void pot.offsetWidth; pot.classList.add('pop');
  }
  window.iroAddColor=iroAddColor;

  function rybToRgb(r,y,b){
    const c=[
      [1,1,1],
      [1,0,0],
      [1,1,0],
      [1,0.5,0],
      [0,0.2,1.0],
      [0.7,0.1,0.9],
      [0,0.66,0.2],
      [0.2,0.094,0],
    ];
    const w=[
      0,
      r*(1-y)*(1-b), (1-r)*y*(1-b), r*y*(1-b),
      (1-r)*(1-y)*b,   r*(1-y)*b,   (1-r)*y*b,   r*y*b,
    ];
    const wsum=w.reduce((s,v)=>s+v,0);
    if(wsum<0.001) return [255,255,255];
    return [0,1,2].map(ch=>Math.round(c.reduce((s,v,i)=>s+v[ch]*w[i],0)/wsum*255));
  }

  function getMixed(){
    if(total===0) return null;
    const rd=drops.red,yd=drops.yellow,bd=drops.blue,wd=drops.white,kd=drops.black;
    const ch=rd+yd+bd;

    if(ch===0){
      if(wd+kd===0) return null;
      const g=Math.round(255*wd/(wd+kd*2));
      return [g,g,g];
    }

    let [r,g,b]=rybToRgb(rd/ch, yd/ch, bd/ch);

    if(wd>0){
      const f=wd/(ch+wd);
      r=Math.round(r*(1-f)+255*f);
      g=Math.round(g*(1-f)+255*f);
      b=Math.round(b*(1-f)+255*f);
    }

    if(kd>0){
      const bf=(ch+wd)/(ch+wd+kd*2);
      r=Math.round(r*bf); g=Math.round(g*bf); b=Math.round(b*bf);
    }

    return [r,g,b];
  }

  function rgbToHsl(r,g,b){
    r/=255;g/=255;b/=255;
    const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
    let h,s,l=(mx+mn)/2;
    if(mx===mn){h=s=0;}
    else{
      const d=mx-mn;
      s=l>.5?d/(2-mx-mn):d/(mx+mn);
      switch(mx){
        case r:h=((g-b)/d+(g<b?6:0))/6;break;
        case g:h=((b-r)/d+2)/6;break;
        case b:h=((r-g)/d+4)/6;break;
      }
    }
    return [h*360,s,l];
  }

  function getColorName(r,g,b){
    const active=Object.keys(drops).filter(k=>drops[k]>0);
    if(active.length===1) return JP[active[0]];
    if(active.length>=4 && total>=4) return 'まぜすぎ！？';
    const [h,s,l]=rgbToHsl(r,g,b);
    if(s<.14){ if(l>.85)return 'しろ'; if(l<.18)return 'くろ'; return 'はいいろ'; }
    const li=l>.62;
    if(h>=8 && h<70){
      if(l<.45) return h<32?'ちゃいろ':'おうどいろ';
      if(h<38 && drops.blue>0) return 'ちゃいろ';
    }
    if(h>=330||h<12)  return 'ももいろ';
    if(h<38)          return li?'うすだいだいいろ':'だいだいいろ';
    if(h<68)          return li?'クリームいろ':'きいろ';
    if(h<92)          return 'きみどり';
    if(h<165)         return li?'うすみどり':'みどり';
    if(h<250)         return li?'みずいろ':'あおいろ';
    if(h<332)         return li?'ラベンダー':'むらさき';
    return li?'うすももいろ':'ももいろ';
  }

  function iroUpdatePot(){

      pot.style.background='#d8d5d0'; pot.style.color='';
      nameEl.textContent='いろをまぜてみよう！'; infoEl.textContent=''; return;
    }
    const [r,g,b]=c; mixedColor=[r,g,b];
    pot.style.background=`rgb(${r},${g},${b})`;
    const bright=(r*299+g*587+b*114)/1000;
    pot.style.color=bright>155?'rgba(60,60,60,.55)':'rgba(255,255,255,.65)';
    nameEl.textContent='✨ '+getColorName(r,g,b)+' ✨';

  function iroResetPot(){
    drops={red:0,blue:0,yellow:0,white:0,black:0}; total=0; mixedColor=[200,180,180];

    pot.style.background='#d8d5d0'; pot.style.color='';

    document.getElementById('dropsInfo').textContent='';
  }
  window.iroResetPot=iroResetPot;

  // ========== RESULT ANIMATION ==========
  function iroShowResult(){
    iroShowScreen('resultScreen');
    if(animRaf) cancelAnimationFrame(animRaf);
    document.getElementById('resultBtns').style.display='none';

    const canvas=document.getElementById('resultCanvas');
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;

    const ctx=canvas.getContext('2d');
    const W=canvas.width, H=canvas.height;
    const potCY=H*.62, potR=Math.min(W,H)*.22;
    const charR=Math.min(W,H)*.20;
    const charTargetY=H*.22;

    const particles=[];
    function burst(x,y,n){
      for(let i=0;i<n;i++){
        const a=Math.random()*Math.PI*2, sp=2+Math.random()*5;
        particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,
          r:4+Math.random()*8,hue:Math.random()*360,life:1,decay:.013+Math.random()*.015});
      }
    }

    let charY=potCY+potR*.2;
    let phase=0, bounceV=0, t=0, textAlpha=0, potFade=1;
    const [cr,cg,cb]=mixedColor;
    const colorLabel=total>0?getColorName(cr,cg,cb):'すてきないろ';
    const quizScore=quizMode&&total>0?calcScore(cr,cg,cb):null;

    function frame(){
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle='#f0eeea'; ctx.fillRect(0,0,W,H);

      particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.14;p.life-=p.decay;});

      if(potFade > 0){
        ctx.save();
        ctx.globalAlpha = potFade;
        ctx.shadowColor='rgba(0,0,0,.18)'; ctx.shadowBlur=22;
        ctx.fillStyle=`rgb(${cr},${cg},${cb})`;
        ctx.beginPath(); ctx.arc(W/2,potCY,potR,0,Math.PI*2); ctx.fill();
        ctx.restore();
      }

      ctx.save();
      if(phase===0 && charY > potCY-potR*.5){
        ctx.beginPath(); ctx.rect(0,0,W,potCY); ctx.clip();
      }
      drawChar(ctx,selectedChar,mixedColor,W/2,charY,charR);
      ctx.restore();

      particles.forEach(p=>{
        if(p.life<=0) return;
        ctx.globalAlpha=p.life;
        ctx.fillStyle=`hsl(${p.hue},82%,68%)`;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
      });
      ctx.globalAlpha=1;

      if(phase===0){
        charY-=9;
        potFade = Math.max(0, (charY - charTargetY) / (potCY - charTargetY));
        if(charY<=charTargetY){ charY=charTargetY; phase=1; bounceV=-3; burst(W/2,charY,22); }
      } else {
        potFade=0;
        if(phase===1){
          bounceV+=.55; charY+=bounceV;
          if(charY>=charTargetY){ charY=charTargetY; bounceV*=-.42; if(Math.abs(bounceV)<.6) phase=2; }
        }
      }

      t++;
      if(t===30) burst(W/2,potCY,18);

      if(phase===2){
        textAlpha=Math.min(1,textAlpha+.04);
        ctx.globalAlpha=textAlpha;
        const fs=Math.min(W*.072,28);
        ctx.textAlign='center'; ctx.textBaseline='middle';

        if(quizMode&&quizScore){
          ctx.fillStyle='#555';
          ctx.font=`bold ${fs*.88}px 'Hiragino Maru Gothic Pro',sans-serif`;
          ctx.fillText(`${selectedChar}が`,W/2,H*.46);
          ctx.fillStyle=`rgb(${Math.min(255,cr+20)},${Math.min(255,cg+10)},${Math.min(255,cb+10)})`;
          ctx.font=`bold ${fs*1.08}px 'Hiragino Maru Gothic Pro',sans-serif`;
          ctx.fillText(`✨ ${colorLabel} ✨`,W/2,H*.53);
          ctx.fillStyle='#555';
          ctx.font=`bold ${fs*.88}px 'Hiragino Maru Gothic Pro',sans-serif`;
          ctx.fillText('になったよ！',W/2,H*.596);
          ctx.fillStyle='#aaa';
          ctx.font=`bold ${fs*.78}px 'Hiragino Maru Gothic Pro',sans-serif`;
          ctx.fillText(`もんだいは「${currentQuiz.name}」`,W/2,H*.65);
          ctx.fillStyle='#f5c020';
          ctx.font=`bold ${fs*1.3}px 'Hiragino Maru Gothic Pro',sans-serif`;
          ctx.fillText(quizScore.stars,W/2,H*.705);
          ctx.fillStyle='#555';
          ctx.font=`bold ${fs*.82}px 'Hiragino Maru Gothic Pro',sans-serif`;
          ctx.fillText(quizScore.msg,W/2,H*.758);
        } else {
          ctx.fillStyle='#555';
          ctx.font=`bold ${fs}px 'Hiragino Maru Gothic Pro',sans-serif`;
          ctx.fillText(`${selectedChar}が`,W/2,H*.52);
          ctx.fillStyle=`rgb(${Math.min(255,cr+20)},${Math.min(255,cg+10)},${Math.min(255,cb+10)})`;
          ctx.font=`bold ${fs*1.15}px 'Hiragino Maru Gothic Pro',sans-serif`;
          ctx.fillText(`✨ ${colorLabel} ✨`,W/2,H*.60);
          ctx.fillStyle='#555';
          ctx.font=`bold ${fs}px 'Hiragino Maru Gothic Pro',sans-serif`;
          ctx.fillText('になったよ！',W/2,H*.672);
        }

        ctx.globalAlpha=1;
        if(textAlpha>=1 && document.getElementById('resultBtns').style.display==='none'){
          document.getElementById('retryBtn').style.display=quizMode?'':'none';
          document.getElementById('resultBtns').style.display='flex';
        }
      }

      animRaf=requestAnimationFrame(frame);
    }
    burst(W/2,potCY,12);
    animRaf=requestAnimationFrame(frame);
  }
  window.iroShowResult=iroShowResult;

  // ========== NAVIGATION ==========
  function iroShowScreen(id){
    document.querySelectorAll('#game-iromaze .screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function iroGoBack(){
    if(animRaf){cancelAnimationFrame(animRaf);animRaf=null;}
    document.getElementById('resultBtns').style.display='none';
    drops={red:0,blue:0,yellow:0,white:0,black:0}; total=0; mixedColor=[200,180,180];
    quizMode=false; currentQuiz=null;
    iroShowScreen('modeScreen');
  }
  window.iroGoBack=iroGoBack;

})();
</script>

  // ===== QUIZ ENGINE =====
  function buildQuestions(gameId){
    questions=[];

      });

      const usedEmoji=new Set();
      const pool=shuffle(GAIRAIGO);
      for(const item of pool){
        if(usedEmoji.has(item.e))continue;
        usedEmoji.add(item.e);
        const distractors=pick(GAIRAIGO.filter(g=>g.w!==item.w),2).map(g=>g.w);

      });

        do{w2=Math.floor(Math.random()*10)+1;}while(w2===n||w2===w1);

          choices:shuffle([n,w1,w2]).map(c=>({cnt:c,txt:emoji.repeat(Math.min(c,10))})),

        spkBtn.onclick=()=>speak(q.word,'en-US');
        qm.appendChild(spkBtn);
        setTimeout(()=>speak(q.word,'en-US'),300);
      } else {
        document.getElementById('ch-q-label').textContent=q.label;
        qm.innerHTML='';
        const letterBtn=document.createElement('button');
        letterBtn.textContent=q.q;
        letterBtn.style.cssText='font-size:5rem;font-weight:bold;color:#333;background:#f0f4ff;border:3px solid #b0c4ff;border-radius:24px;width:100px;height:100px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;line-height:1;';
        letterBtn.ontouchstart=function(){};
        letterBtn.onclick=()=>speak(LETTER_SPEAK[q.q]||q.q,'en-US');
        qm.appendChild(letterBtn);
        setTimeout(()=>speak(LETTER_SPEAK[q.q]||q.q,'en-US'),300);
      }
      cc.className='ch-audio-choices';
      q.choices.forEach(choice=>{
        const card=document.createElement('button');
        card.className='ch-audio-card';card.ontouchstart=function(){};
        card.innerHTML='<div class="ch-audio-card-emoji">'+choice.e+'</div>';
        card.dataset.v=choice.w;
        card.onclick=()=>onAudioChoice(card,q);
        cc.appendChild(card);
      });
    } else {
      document.getElementById('ch-q-label').textContent=q.label;
      qm.textContent=q.q;
      qm.style.fontSize=(q.type==='emoji'||q.type==='gairaigo')?'5rem':'4.5rem';
      cc.className='ch-choices';
      q.choices.forEach(choice=>{
        const btn=document.createElement('button');
        btn.className='ch-choice-btn';btn.ontouchstart=function(){};
        if(q.type==='count'){
          btn.style.fontSize=q.ans>=8?'.85rem':'1rem';
          btn.style.lineHeight='1.6';
          btn.textContent=choice.txt;btn.dataset.v=choice.cnt;
        } else if(q.type==='gairaigo'){
          btn.style.fontSize=choice.length>4?'1rem':'1.2rem';
          btn.textContent=choice;btn.dataset.v=choice;
        } else {
          btn.textContent=choice;btn.dataset.v=choice;
        }
        btn.onclick=()=>onChoice(btn,q);
        cc.appendChild(btn);
      });
    }
  }

  function onChoice(btn,q){
    if(answered)return;
    answered=true;
    const val=q.type==='count'?parseInt(btn.dataset.v):btn.dataset.v;
    const ok=val===q.ans;
    if(ok){btn.classList.add('correct');score++;}
    else{
      btn.classList.add('wrong');
      document.querySelectorAll('.ch-choice-btn').forEach(b=>{
        if((q.type==='count'?parseInt(b.dataset.v):b.dataset.v)===q.ans)b.classList.add('correct');
      });
    }
    setTimeout(()=>{qIdx++;showQ();},900);
  }

  function onAudioChoice(card,q){
    if(answered)return;
    answered=true;
    window.speechSynthesis&&window.speechSynthesis.cancel();
    const ok=card.dataset.v===q.ans;
    if(ok){card.classList.add('correct');score++;}
    else{
      card.classList.add('wrong');
      document.querySelectorAll('.ch-audio-card').forEach(c=>{
        if(c.dataset.v===q.ans)c.classList.add('correct');
      });
    }
    setTimeout(()=>{qIdx++;showQ();},900);
  }

  // ===== MOJI NARABE =====
  function startNarabeRound(){
    nWord=nPool[nRound%nPool.length];
    nInput=[];nShuffled=shuffle(nWord.w.split(''));nUsedOrder=[];nFlash=null;
    document.getElementById('ch-q-label').textContent='このえのなまえをならべよう！';
    const qm=document.getElementById('ch-q-main');
    qm.style.fontSize='5rem';qm.textContent=nWord.e;
    document.getElementById('ch-progress-bar').style.width=((nRound/5)*100)+'%';
    document.getElementById('ch-score-text').textContent=score+'/'+nRound+'もん';
    renderNarabe();
  }

  function renderNarabe(){
    const cc=document.getElementById('ch-choices');
    cc.innerHTML='';cc.className='';
    const wrap=document.createElement('div');
    wrap.className='narabe-area';
    // Slots
    const slotsDiv=document.createElement('div');
    slotsDiv.className='narabe-slots';
    for(let i=0;i<nWord.w.length;i++){
      const s=document.createElement('div');
      let cls='narabe-slot'+(i<nInput.length?' filled':'');
      if(nFlash==='correct'&&i<nInput.length)cls+=' correct';
      if(nFlash==='wrong'&&i<nInput.length)cls+=' wrong';
      s.className=cls;
      s.textContent=i<nInput.length?nInput[i]:'';
      slotsDiv.appendChild(s);
    }
    if(!nFlash){
      const bk=document.createElement('button');
      bk.style.cssText='background:#f3f4f6;border:none;border-radius:12px;font-size:.85rem;font-weight:bold;color:#aaa;cursor:pointer;padding:8px 14px;margin-left:6px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;';
      bk.textContent='もういちど';bk.ontouchstart=function(){};
      bk.onclick=()=>{nInput=[];nUsedOrder=[];renderNarabe();};
      slotsDiv.appendChild(bk);
    }
    wrap.appendChild(slotsDiv);
    // Tiles
    if(!nFlash){
      const tilesDiv=document.createElement('div');
      tilesDiv.className='narabe-tiles';
      nShuffled.forEach((tile,ti)=>{
        const t=document.createElement('div');
        t.className='narabe-tile'+(nUsedOrder.includes(ti)?' used':'');
        t.textContent=tile;t.ontouchstart=function(){};
        t.onclick=()=>onNarabeTile(ti);
        tilesDiv.appendChild(t);
      });
      wrap.appendChild(tilesDiv);
    }
    const rnd=document.createElement('div');
    rnd.className='narabe-round';
    rnd.textContent=(nRound+1)+' / 5もん';
    wrap.appendChild(rnd);
    cc.appendChild(wrap);
  }

  function onNarabeTile(ti){
    if(nUsedOrder.includes(ti)||nInput.length>=nWord.w.length||nFlash)return;
    nUsedOrder.push(ti);
    nInput.push(nShuffled[ti]);
    if(nInput.length===nWord.w.length){
      const ok=nInput.join('')===nWord.w;
      nFlash=ok?'correct':'wrong';
      if(ok)score++;
      renderNarabe();
      setTimeout(()=>{
        nFlash=null;nRound++;
        if(nRound>=5)showResult();else startNarabeRound();
      },900);
    } else {
      renderNarabe();
    }
  }

  // ===== KAZU NARABE =====
  function startKazuNarabe(){
    // レベル選択画面
    document.getElementById('ch-q-label').textContent='レベルをえらんでね！';
    const qm=document.getElementById('ch-q-main');
    qm.innerHTML='';
    document.getElementById('ch-progress-bar').style.width='0%';
    document.getElementById('ch-score-text').textContent='';
    const cc=document.getElementById('ch-choices');
    cc.innerHTML='';cc.className='ch-choices';
    const levels=[
      {lv:1,label:'⭐ かんたん',desc:'１〜１０のかずをならべよう'},
      {lv:2,label:'⭐⭐ ちょっとむずかしい',desc:'１〜５０のかずをならべよう'},
      {lv:3,label:'⭐⭐⭐ むずかしい',desc:'１〜１００のかずをならべよう'},
    ];
    levels.forEach(({lv,label,desc})=>{
      const btn=document.createElement('button');
      btn.className='ch-choice-btn';btn.ontouchstart=function(){};
      btn.innerHTML='<span style="font-size:1.15rem;font-weight:bold;">'+label+'</span>'
        +'<br><span style="font-size:.8rem;color:#aaa;font-weight:normal;">'+desc+'</span>';
      btn.onclick=()=>startKazuLevel(lv);
      cc.appendChild(btn);
    });
  }

  function startKazuLevel(lv){
    knLevel=lv;knRound=0;score=0;
    startKazuRound();
  }

  function startKazuRound(){
    const all=Array.from({length:knLevel===1?10:knLevel===2?50:100},(_,i)=>i+1);
    const count=knLevel===1?10:knLevel===2?15:20;
    knSorted=shuffle(all).slice(0,count).sort((a,b)=>a-b);
    knOrder=shuffle(knSorted.slice());
    knNextIdx=0;knDone=[];
    document.getElementById('ch-q-label').textContent='ちいさいじゅんにタッチしてね！';
    const qm=document.getElementById('ch-q-main');
    qm.innerHTML='';
    document.getElementById('ch-progress-bar').style.width=((knRound/3)*100)+'%';
    document.getElementById('ch-score-text').textContent=(knRound+1)+'/3もん';
    renderKazu();
  }

  function showKazuHint(){
    const inst=document.getElementById('kazu-inst');
    if(!inst||knNextIdx>=knSorted.length)return;
    inst.textContent='つぎは「'+knSorted[knNextIdx]+'」！';
    clearTimeout(window._knHintTimer);
    window._knHintTimer=setTimeout(()=>{
      if(inst)inst.textContent='';
    },2000);
  }

  function renderKazu(){
    const cc=document.getElementById('ch-choices');
    cc.innerHTML='';cc.className='';
    const wrap=document.createElement('div');
    wrap.style.cssText='display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;';
    // instruction + hint button row
    const topRow=document.createElement('div');
    topRow.style.cssText='display:flex;align-items:center;gap:10px;';
    const inst=document.createElement('div');
    inst.id='kazu-inst';inst.className='kazu-instruction';
    inst.textContent='';
    const hintBtn=document.createElement('button');
    hintBtn.textContent='💡ヒント';hintBtn.ontouchstart=function(){};
    hintBtn.onclick=showKazuHint;
    hintBtn.style.cssText='background:#fff9c4;border:2px solid #f9d71c;border-radius:50px;padding:5px 12px;font-size:.8rem;font-weight:bold;color:#888;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;white-space:nowrap;';
    topRow.appendChild(inst);topRow.appendChild(hintBtn);
    wrap.appendChild(topRow);
    const grid=document.createElement('div');
    const btnSize=knSorted.length<=10?54:knSorted.length<=15?48:44;
    const perRow=knSorted.length<=10?5:5;
    const containerW=perRow*btnSize+(perRow-1)*8;
    grid.style.cssText='display:flex;flex-wrap:wrap;gap:8px;width:'+containerW+'px;justify-content:center;';
    knOrder.forEach(n=>{
      const btn=document.createElement('button');
      btn.id='kazu-btn-'+n;
      btn.textContent=n;btn.ontouchstart=function(){};
      btn.onclick=()=>onKazuClick(n);
      const fs=n>=100?'1rem':n>=10?'1.2rem':'1.4rem';
      btn.style.cssText='width:'+btnSize+'px;height:'+btnSize+'px;min-width:'+btnSize+'px;min-height:'+btnSize+'px;max-width:'+btnSize+'px;max-height:'+btnSize+'px;'
        +'border:none;border-radius:12px;font-size:'+fs+';font-weight:bold;color:#555;background:white;'
        +'cursor:pointer;display:flex;align-items:center;justify-content:center;'
        +'box-shadow:0 3px 8px rgba(0,0,0,.12);-webkit-tap-highlight-color:transparent;touch-action:manipulation;flex-shrink:0;';
      grid.appendChild(btn);
    });
    wrap.appendChild(grid);
    cc.appendChild(wrap);
  }

  function onKazuClick(n){
    if(knDone.includes(n))return;
    const btn=document.getElementById('kazu-btn-'+n);
    if(n===knSorted[knNextIdx]){
      btn.style.background='#4caf50';btn.style.color='white';
      knDone.push(n);knNextIdx++;
      const inst=document.getElementById('kazu-inst');
      if(knNextIdx<knSorted.length){
        if(inst)inst.textContent='';
      } else {
        clearTimeout(window._knHintTimer);
        if(inst)inst.textContent='ぜんぶできた！🎉';
        score++;
        setTimeout(()=>{
          knRound++;
          if(knRound>=3)showResult();
          else startKazuRound();
        },800);
      }
    } else {
      btn.style.background='#ef5350';btn.style.color='white';
      setTimeout(()=>{btn.style.background='white';btn.style.color='#555';},400);
    }
  }

  // ===== RESULT =====
  function showResult(){
    document.getElementById('ch-game-area').style.display='none';
    document.getElementById('ch-result').classList.add('active');
    const total=(curGame==='narabe'||curGame==='narabe_kata')?5:curGame==='kazunarabe'?3:10;
    const pct=score/total;
    let emoji,msg;
    if(pct===1){emoji='🏆';msg='かんぺき！！';}
    else if(pct>=.8){emoji='🌟';msg='すごい！';}
    else if(pct>=.6){emoji='😊';msg='よくできました！';}
    else if(pct>=.4){emoji='👍';msg='もうすこし！';}
    else{emoji='🐣';msg='またちょうせんしてね！';}
    document.getElementById('ch-result-emoji').textContent=emoji;
    document.getElementById('ch-result-score').textContent=score+' / '+total;
    document.getElementById('ch-result-msg').textContent=msg;
  }

})();
</script>

<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js');
}
</script>
